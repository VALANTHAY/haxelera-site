# Amplify Hosting: el sitio es estático y no se compila. Solo se publican index.html, css, js y assets
# (el servidor de experiencias y la documentación no se sirven).
version: 1
frontend:
  phases:
    build:
      commands:
        - mkdir -p dist
        - cp -R index.html css js assets dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
